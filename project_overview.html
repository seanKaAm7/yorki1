<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yorki - Screen First Project Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;
  --panel:#151923;
  --panel2:#1c2230;
  --panel3:#222938;
  --line:#2a3142;
  --text:#ece7dc;
  --muted:#9c958a;
  --soft:#6f7788;
  --accent:#f0ad4e;
  --accent2:#8fd36a;
  --danger:#e26f53;
  --wood:#392316;
  --ink:#12151d;
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  overflow:hidden;
}
a{color:inherit}
button{font:inherit}
.page{height:100vh;display:flex;flex-direction:column}
.top{
  height:58px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 22px;
  border-bottom:1px solid var(--line);
  background:rgba(15,17,23,.96);
  flex-shrink:0;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:280px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:0}
.brand span{font-size:12px;color:var(--muted)}
.top-note{font-size:12px;color:var(--muted);line-height:1.45}
.links{margin-left:auto;display:flex;gap:8px;align-items:center}
.links a{
  text-decoration:none;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  padding:7px 10px;
  border-radius:6px;
  font-size:12px;
  white-space:nowrap;
}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.tabs{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 22px;
  border-bottom:1px solid var(--line);
  background:#11151d;
  flex-shrink:0;
  overflow-x:auto;
}
.tab{
  min-width:132px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
  text-align:left;
}
.tab strong{display:block;font-size:12px;margin-bottom:2px;color:inherit}
.tab span{display:block;font-size:10px;color:var(--soft);white-space:nowrap}
.tab:hover{border-color:#4a5265;color:var(--text)}
.tab.on{background:rgba(240,173,78,.11);border-color:rgba(240,173,78,.75);color:var(--accent)}
.workspace{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:minmax(620px,1fr) 360px;
  overflow:hidden;
}
.stage-panel{
  min-width:0;
  display:flex;
  flex-direction:column;
  padding:18px 20px 20px;
  gap:12px;
  overflow:auto;
}
.screen-head{
  display:flex;
  align-items:flex-end;
  gap:16px;
  flex-shrink:0;
}
.screen-kicker{
  font-size:10px;
  color:var(--accent);
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:5px;
}
.screen-title{font-size:22px;font-weight:850;letter-spacing:0}
.screen-summary{max-width:780px;color:var(--muted);font-size:13px;line-height:1.55}
.frame-wrap{
  flex:1;
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.screen-frame{
  position:relative;
  width:min(100%,1120px);
  aspect-ratio:16/9;
  min-height:380px;
  max-height:calc(100vh - 210px);
  background:#0b0d12;
  border:1px solid #32394a;
  box-shadow:0 24px 60px rgba(0,0,0,.34);
  overflow:hidden;
}
.game-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.shade{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,.05) 45%,rgba(0,0,0,.18));
  pointer-events:none;
}
.person-hit{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
}
.person-image{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:auto;
  filter:drop-shadow(0 13px 18px rgba(0,0,0,.32));
}
.talk-person-img{left:36.8%;top:8.5%;width:26.4%;height:63.8%}
.talk-person-hit{left:39.4%;top:14.2%;width:21.2%;height:56%}
.drawing-person-img{left:7%;top:16.5%;width:31%;height:78%}
.drawing-person-hit{left:12.4%;top:29%;width:18.5%;height:55.5%}
.hud{
  position:absolute;
  left:2.1%;
  top:3.3%;
  width:20.2%;
  height:36.8%;
  background:rgba(43,29,19,.93);
  border:2px solid rgba(117,78,45,.72);
  color:#f1eadc;
  box-shadow:0 12px 26px rgba(0,0,0,.34);
}
.hud-top{
  height:32%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  padding:10px 12px;
  border-bottom:2px solid rgba(117,78,45,.54);
  background:rgba(36,25,18,.9);
}
.hud-place{grid-column:1/3;font-size:12px;color:#d6c7ae;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-day{font-size:19px;font-weight:850;text-align:center}
.hud-time{font-size:18px;font-weight:800;text-align:right}
.hud-row{height:13.6%;display:grid;grid-template-columns:38% 1fr;align-items:center;padding:0 13px;font-size:13px;font-weight:760}
.bar{height:14px;background:#241b16;position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0}
.bar.energy span{width:78%;background:#79c34a}
.bar.rep span{width:72%;background:#e5a41f}
.bar.material span{width:60%;background:#bd7a39}
.right-cards{
  position:absolute;
  right:3.3%;
  top:8.2%;
  width:22.7%;
  display:grid;
  gap:10px;
}
.status-card{
  min-height:82px;
  background:rgba(35,24,18,.94);
  border:2px solid rgba(99,65,38,.7);
  color:#f4ebdb;
  padding:14px 15px;
  box-shadow:0 12px 26px rgba(0,0,0,.28);
}
.status-card b{display:block;font-size:13px;margin-bottom:9px;color:#f6e9cf}
.status-card p{font-size:13px;line-height:1.55}
.menu-buttons{
  position:absolute;
  right:3.2%;
  top:2.8%;
  display:flex;
  gap:4px;
}
.menu-buttons div{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:rgba(35,24,18,.95);
  border:2px solid rgba(104,70,43,.85);
  font-size:12px;
  font-weight:850;
}
.dialogue{
  position:absolute;
  left:19%;
  right:19%;
  bottom:5%;
  height:19%;
  background:rgba(15,18,25,.91);
  border:2px solid rgba(70,76,90,.8);
  box-shadow:0 14px 30px rgba(0,0,0,.35);
  padding:20px 28px;
}
.speaker{font-size:13px;font-weight:900;color:#f3df9b;margin-bottom:7px}
.line{font-size:18px;font-weight:780;color:#f8f2e8}
.arrow{position:absolute;right:28px;bottom:18px;color:#f1d783;font-size:18px}
.desk-area{
  position:absolute;
  right:-1.5%;
  top:-3.2%;
  height:106%;
  aspect-ratio:1952/2180;
  filter:drop-shadow(-14px 0 20px rgba(0,0,0,.22));
}
.desk{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}
.draw-overlay{
  position:absolute;
  inset:0;
  border:1px solid rgba(240,173,78,.14);
  pointer-events:none;
}
.paper-mark{
  position:absolute;
  left:38%;
  top:13%;
  width:35%;
  height:48%;
  border-radius:50%;
  border:9px solid rgba(226,157,92,.65);
  transform:rotate(-19deg);
  opacity:.7;
}
.paper-mark:after{
  content:"";
  position:absolute;
  left:21%;
  top:42%;
  width:73%;
  height:46%;
  border-radius:50%;
  border:8px solid rgba(226,157,92,.65);
  transform:rotate(31deg);
}
.modal-shade{
  position:absolute;
  inset:0;
  background:rgba(11,9,8,.48);
}
.modal{
  position:absolute;
  left:4%;
  top:8%;
  width:61%;
  height:78%;
  background:rgba(47,31,22,.95);
  border:2px solid rgba(118,78,45,.78);
  color:#eadfce;
  box-shadow:0 24px 60px rgba(0,0,0,.42);
  padding:28px 30px;
}
.modal h3{font-size:26px;margin-bottom:18px}
.modal-grid{display:grid;grid-template-columns:34% 1fr 24%;gap:18px;height:calc(100% - 52px)}
.modal-list,.modal-preview,.modal-side{
  border:2px solid rgba(106,70,42,.6);
  background:rgba(25,18,14,.42);
  padding:18px;
  position:relative;
}
.modal-preview{display:grid;place-items:center;text-align:center;color:#c7bba9;font-size:18px;font-weight:800}
.modal-side p{font-size:15px;line-height:1.65;margin-bottom:12px}
.summary-box{
  position:absolute;
  right:4%;
  top:19%;
  width:28%;
  min-height:50%;
  background:rgba(37,25,18,.96);
  border:2px solid rgba(120,82,50,.85);
  color:#f3e8d8;
  padding:28px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.summary-box h3{font-size:25px;margin-bottom:18px}
.summary-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid rgba(143,103,69,.45);
  padding:10px 0;
  font-size:15px;
}
.summary-next{
  margin-top:22px;
  height:48px;
  display:grid;
  place-items:center;
  background:#b7843e;
  color:#21140b;
  font-weight:900;
  border:2px solid #e4bd72;
}
.flow-view{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:5%;
}
.flow-board{
  position:relative;
  width:88%;
  height:74%;
  background:rgba(16,20,28,.86);
  border:2px solid rgba(240,173,78,.35);
  box-shadow:0 18px 50px rgba(0,0,0,.34);
  padding:30px;
}
.flow-title{font-size:23px;font-weight:900;margin-bottom:18px}
.flow-cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  align-items:stretch;
}
.flow-card{
  min-height:132px;
  border:1px solid rgba(240,173,78,.35);
  background:rgba(36,29,23,.86);
  padding:16px;
  position:relative;
}
.flow-card b{display:block;color:#f4d39b;font-size:14px;margin-bottom:10px}
.flow-card p{font-size:12px;line-height:1.55;color:#c8bca9}
.flow-arrow{
  position:absolute;
  top:50%;
  right:-16px;
  transform:translateY(-50%);
  color:#f0ad4e;
  font-weight:900;
  z-index:2;
}
.guide-target{
  cursor:pointer;
  outline:1px dashed rgba(245,187,83,.42);
  outline-offset:1px;
  transition:.14s;
}
.guide-target:hover{
  outline-color:rgba(245,187,83,.98);
  box-shadow:0 0 0 1px rgba(245,187,83,.22),0 12px 30px rgba(0,0,0,.22);
}
.guide-target.active{
  outline-color:rgba(143,211,106,.98);
  box-shadow:0 0 0 2px rgba(143,211,106,.2),0 14px 34px rgba(0,0,0,.26);
}
.guide-label{
  position:absolute;
  left:8px;
  top:7px;
  z-index:12;
  max-width:calc(100% - 16px);
  background:rgba(245,187,83,.94);
  color:#1e160f;
  border:1px solid rgba(255,239,188,.85);
  padding:3px 7px;
  border-radius:5px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}
.guide-target.active>.guide-label{background:rgba(143,211,106,.96);border-color:#def5c9}
.desk-target{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  color:inherit;
  text-align:left;
}
.desk-target.all{left:0;top:0;width:100%;height:100%}
.desk-target.tools{left:3.6%;top:5.8%;width:13%;height:55.2%}
.desk-target.canvas{left:21.1%;top:5.2%;width:51.4%;height:55.8%}
.desk-target.palette{left:3.4%;top:64.6%;width:66.4%;height:32.2%}
.desk-target.submit{right:2.4%;top:68.8%;width:24.8%;height:27.9%}
.inspector{
  min-width:0;
  border-left:1px solid var(--line);
  background:#11151d;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.detail{
  padding:18px;
  overflow:auto;
  border-bottom:1px solid var(--line);
  flex:1;
}
.detail-kicker{
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.detail h2{font-size:21px;line-height:1.25;margin-bottom:8px}
.detail p{font-size:13px;line-height:1.65;color:#d8d0c2;margin-bottom:14px}
.file-list{
  display:grid;
  gap:9px;
  margin:12px 0 16px;
}
.file-card{
  display:block;
  text-decoration:none;
  color:#d5c9b7;
  border:1px solid var(--line);
  background:var(--panel);
  padding:10px 11px;
  border-radius:6px;
  line-height:1.35;
}
.file-card:hover{border-color:var(--accent)}
.file-name{
  display:block;
  color:#f1dfbd;
  font-size:12px;
  font-weight:850;
  margin-bottom:5px;
}
.file-role{
  display:block;
  color:#c5bcad;
  font-size:12px;
  line-height:1.52;
  margin-bottom:6px;
}
.file-focus{
  display:block;
  color:#8f98aa;
  font-size:11px;
  line-height:1.5;
}
.file-focus b{color:#f0ad4e}
.check-list{display:grid;gap:8px;margin-top:12px}
.check{
  display:grid;
  grid-template-columns:18px 1fr;
  gap:8px;
  color:#c5bcad;
  font-size:12px;
  line-height:1.55;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  margin-top:6px;
}
.order{
  padding:16px 18px 18px;
  background:#0f131b;
  flex-shrink:0;
}
.order h3{font-size:13px;margin-bottom:10px;color:#f1e7d8}
.order ol{padding-left:18px;color:#a8a093;font-size:12px;line-height:1.72}
.order li::marker{color:var(--accent);font-weight:800}
.order-note{
  margin-top:12px;
  color:#7e879a;
  font-size:11px;
  line-height:1.55;
}
.mobile-hint{display:none}
@media(max-width:1080px){
  body{overflow:auto}
  .page{height:auto;min-height:100vh}
  .top{height:auto;align-items:flex-start;padding:14px;flex-wrap:wrap}
  .brand{min-width:0;width:100%}
  .links{margin-left:0;flex-wrap:wrap}
  .workspace{display:block;overflow:visible}
  .stage-panel{overflow:visible;padding:14px}
  .frame-wrap{min-height:0}
  .screen-frame{min-height:0;max-height:none;width:100%}
  .inspector{border-left:0;border-top:1px solid var(--line)}
  .detail{max-height:none}
  .mobile-hint{display:block;color:#9c958a;font-size:12px;line-height:1.5;margin-top:4px}
  .guide-label{font-size:9px;padding:2px 5px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <h1>Yorki, the Portraitist</h1>
      <span>Screen-first guide · Prototype v66</span>
    </div>
    <p class="top-note">프로젝트를 코드 구조가 아니라 실제 게임 화면 기준으로 읽는 문서입니다. 화면 위 노란 박스를 누르면 “이 UI가 뭔지 / 어떤 파일이 담당하는지”가 오른쪽에 나옵니다.</p>
    <nav class="links" aria-label="project links">
      <a href="architecture.html">architecture.html</a>
      <a href="PROGRESS.md">PROGRESS.md</a>
      <a href="GAME_PLAN.md">GAME_PLAN.md</a>
      <a href="PATCH_NOTES.js">PATCH_NOTES.js</a>
    </nav>
  </header>

  <nav class="tabs" id="tabs" aria-label="screen tabs"></nav>

  <main class="workspace">
    <section class="stage-panel">
      <div class="screen-head">
        <div>
          <div class="screen-kicker" id="screenKicker"></div>
          <h2 class="screen-title" id="screenTitle"></h2>
        </div>
        <p class="screen-summary" id="screenSummary"></p>
      </div>
      <p class="mobile-hint">작은 화면에서는 노란 박스가 좁게 보일 수 있습니다. 박스를 누르면 아래 설명 패널이 바뀝니다.</p>
      <div class="frame-wrap">
        <div class="screen-frame" id="screenFrame" aria-live="polite"></div>
      </div>
    </section>

    <aside class="inspector">
      <section class="detail" id="detail"></section>
      <section class="order" id="learningOrder"></section>
    </aside>
  </main>
</div>

<script>
const DATA={
  version:"Prototype v66",
  assets:{
    bg:"yorki/Assets/Sprites/SceneA/MapBackgroundDraft2.png",
    goro:"yorki/Assets/Sprites/SceneA/Customer_Goro.png",
    winter:"yorki/Assets/Sprites/SceneA/Customer_Winter.png",
    desk:"yorki/Assets/Sprites/UI/SceneA/Desk/ui_final_reference.png"
  },
  screens:[
    {
      id:"talk",
      tab:"TalkScene",
      kind:"대화 화면",
      title:"손님을 만나고 하루 상태를 보는 화면",
      summary:"플레이어가 가장 자주 돌아오는 기본 화면입니다. 손님 대사, 현재 목표, 수입/시간/에너지/평판/재료, 설정과 기록 버튼이 여기서 보입니다.",
      files:[
        {name:"TalkSceneController.cs",path:"yorki/Assets/Scripts/TalkSceneController.cs",role:"대화 화면의 진행자입니다. 첫 독백, 손님별 대사 시작, 대사 종료 판단, SceneA 진입, 결과 대사 재생, 하루 종료 진입을 한 줄기로 묶습니다.",focus:"먼저 볼 곳: 대사 진행 메서드와 SceneTransition 호출 지점. 대사 문장 자체를 고치려면 이 파일보다 CustomerEpisodeData asset을 봅니다."},
        {name:"TalkSceneHUDController.cs",path:"yorki/Assets/Scripts/TalkSceneHUDController.cs",role:"좌측 HUD 표시 전용 파일입니다. 수입, 시간, 에너지, 평판, 재료 값을 화면 텍스트와 바 형태로 바꿔 보여줍니다.",focus:"먼저 볼 곳: GameManager 값을 읽어 UI에 반영하는 갱신 함수. 실제 수입/에너지 계산 책임은 여기가 아니라 GameManager 쪽입니다."},

const tabs=document.getElementById("tabs");
const frame=document.getElementById("screenFrame");
const detail=document.getElementById("detail");
const screenKicker=document.getElementById("screenKicker");
const screenTitle=document.getElementById("screenTitle");
const screenSummary=document.getElementById("screenSummary");
const learningOrder=document.getElementById("learningOrder");
const requestedScreen=new URLSearchParams(window.location.search).get("screen");
let activeScreenId=DATA.screens.some(screen=>screen.id===requestedScreen)?requestedScreen:DATA.screens[0].id;
let activeHotspotId=screenById(activeScreenId).hotspots[0].id;

function esc(value){
  return String(value).replace(/[&<>"']/g, ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function screenById(id){
  return DATA.screens.find(screen=>screen.id===id) || DATA.screens[0];
}

function hotspotById(screen,id){
  return screen.hotspots.find(hotspot=>hotspot.id===id) || screen.hotspots[0];
}

function renderTabs(){
  tabs.innerHTML=DATA.screens.map(screen=>`
    <button class="tab ${screen.id===activeScreenId?"on":""}" data-screen="${esc(screen.id)}">
      <strong>${esc(screen.tab)}</strong>
      <span>${esc(screen.kind)}</span>
    </button>
  `).join("");
  tabs.querySelectorAll(".tab").forEach(button=>{
    button.addEventListener("click",()=>{
      activeScreenId=button.dataset.screen;
      activeHotspotId=screenById(activeScreenId).hotspots[0].id;
      render();
    });
  });
}

function loopMarkup(){
  const cards=[
    ["stepTalk","TalkScene","손님 등장과 대사"],
    ["stepDraw","SceneA","직접 그리기"],
    ["stepScore","Score","그림 평가와 반응"],
    ["stepRecord","Records","초상화 저장"],
    ["stepDay","Summary","하루 정산"]
  ];
  return `
    ${commonBackground()}
    <div class="modal-shade"></div>
    <div class="flow-view">
      <div class="flow-board">
        <div class="flow-title">하루 루프를 화면 기준으로 읽기</div>
        <div class="flow-cards">
          ${cards.map((card,index)=>`
            <div class="flow-card guide-target" data-hotspot="${esc(card[0])}" role="button" tabindex="0" aria-label="${esc(card[1])}">
              <span class="guide-label">${index+1}</span>
              <b>${index+1}. ${esc(card[1])}</b>
              <p>${esc(card[2])}</p>
              ${index<cards.length-1?'<div class="flow-arrow">→</div>':""}
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}

function screenMarkup(screen){
  if(screen.id==="talk") return talkMarkup();
  if(screen.id==="drawing") return drawingMarkup();
  if(screen.id==="records") return recordsMarkup();
  return loopMarkup();
}

function renderScreen(screen){
  frame.innerHTML=screenMarkup(screen);
  frame.querySelectorAll("[data-hotspot]").forEach(target=>{
    if(target.dataset.hotspot===activeHotspotId) target.classList.add("active");
    target.addEventListener("click",event=>{
      event.stopPropagation();
      activeHotspotId=target.dataset.hotspot;
      render();
    });
    target.addEventListener("keydown",event=>{
      if(event.key!=="Enter"&&event.key!==" ") return;
      event.preventDefault();
      activeHotspotId=target.dataset.hotspot;
      render();
    });
  });
}

function renderDetail(screen,hotspot){
  const files=screen.files.map(file=>{
    const name=esc(file.name);
    const href=file.path;
    const content=`
      <span class="file-name">${name}</span>
      <span class="file-role">${esc(file.role)}</span>
      <span class="file-focus"><b>읽는 포인트</b> ${esc(file.focus)}</span>
    `;
    if(href) return `<a class="file-card" href="${esc(href)}">${content}</a>`;
    return `<span class="file-card">${content}</span>`;
  }).join("");
  const checks=screen.checks.map(item=>`
    <div class="check"><span class="dot"></span><span>${esc(item)}</span></div>
  `).join("");
  detail.innerHTML=`
    <div class="detail-kicker">${esc(screen.kind)} · ${esc(screen.tab)}</div>
    <h2>${esc(hotspot.title)}</h2>
    <p>${esc(hotspot.body)}</p>
    <div class="detail-kicker">담당 파일</div>
    <div class="file-list">${files}</div>
    <div class="detail-kicker">이 화면에서 확인할 것</div>
    <div class="check-list">${checks}</div>
  `;
}

function renderOrder(screen){
  const steps=screen.learn.map(step=>`<li>${esc(step)}</li>`).join("");
  learningOrder.innerHTML=`
    <h3>${esc(screen.tab)} 처음 이해할 때 보는 순서</h3>
    <ol>${steps}</ol>
    <p class="order-note">위 순서는 이 탭 전용입니다. 다른 탭으로 바꾸면 담당 파일과 읽는 순서도 같이 바뀝니다.</p>
  `;
}

function render(){
  const screen=screenById(activeScreenId);
  const hotspot=hotspotById(screen,activeHotspotId);
  activeHotspotId=hotspot.id;
  screenKicker.textContent=`${screen.kind} · ${DATA.version}`;
  screenTitle.textContent=screen.title;
  screenSummary.textContent=screen.summary;
  renderTabs();
  renderScreen(screen);
  renderDetail(screen,hotspot);
  renderOrder(screen);
}

render();
